name: Release Zip

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Create zip (single top-level folder)
        run: |
          rm -rf package
          mkdir -p package/cqafabric_qgis
          rsync -a --exclude ".git" --exclude "package" ./ package/cqafabric_qgis/
          (cd package && zip -r ../cqafabric_qgis.zip cqafabric_qgis)

      - name: Create release and upload zip
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.run_number }}
          name: Release ${{ github.run_number }}
          files: cqafabric_qgis.zip
